name: Android APK

# Build a testable debug APK on demand. It is published as a pre-release (`android-debug-<run number>`) on the
# repository's Releases page, not as a run artifact: release assets do not count against the Actions artifact storage
# quota. The newest 5 such pre-releases are kept; older ones (and their tags) are deleted. The APK installs beside the
# release app as Honeydew Debug. `base` (the default) leaves the sound library out
# (-arm-base-debug.apk, about 50 MB): the app downloads the sounds once, from the sound library's release (#66).
# `full` ships them (-arm-debug.apk). No debug key is kept in the repository: every build signs with a fresh one, so a
# debug APK does not install over another (uninstall Honeydew Debug first). Releases sign with the release key secrets.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK to build
        required: true
        default: base
        type: choice
        options:
          - base
          - full

permissions:
  # Creating the pre-release and its tag.
  contents: write

env:
  CARGO_TERM_COLOR: always
  SOUNDS_TAG: v0.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      # The static FFmpeg (with x264) of the Displayer's video and the MP4 render, per ABI; cached until the script changes.
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: |
          # A failure's log tail (and configure's) as annotations, as the APK step does.
          note() { awk '{ gsub(/%/, "%25"); buf = (n ? buf "%0A" : "") $0; n++ }
                        n == 40 { print "::error title=ffmpeg::" buf; buf = ""; n = 0 }
                        END { if (n) print "::error title=ffmpeg::" buf }'; }
          for abi in arm64 armv7; do
            if ! tools/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg/$abi" android-$abi > "$RUNNER_TEMP/ffmpeg-$abi.log" 2>&1; then
              { tail -n 60 "$RUNNER_TEMP/ffmpeg-$abi.log"
                tail -n 40 "$RUNNER_TEMP"/ffmpeg/src/FFmpeg-*/ffbuild/config.log 2>/dev/null
                tail -n 20 "$RUNNER_TEMP"/ffmpeg/src/x264-*/config.log 2>/dev/null; } | note
              exit 1
            fi
            tail -n 3 "$RUNNER_TEMP/ffmpeg-$abi.log"
          done
          rm -rf "$RUNNER_TEMP/ffmpeg/src"
      # Saved at once, so that a later failure of the app's build does not build FFmpeg again.
      - name: FFmpeg cache save
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg.sh') }}
      # The library the release of this version ships, unpacked where `tools/android-dist.sh` looks for it. A base
      # APK has none.
      - name: Sound library
        if: inputs.variant == 'full'
        run: |
          mkdir -p target/android/assets
          url="https://github.com/jikk12kk-bot-bot/honeydew/releases/download/$SOUNDS_TAG/honeydew-$SOUNDS_TAG-sounds.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/sounds.zip" "$url"
          unzip -q "$RUNNER_TEMP/sounds.zip" 'content/*' -x '*.gz' -d target/android/assets
          rm -f "$RUNNER_TEMP/sounds.zip"
      - name: Build the debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
          # The build's number, its release's (`android-debug-<n>`): the app's updates compare it (`update::BUILD`).
          HONEYDEW_BUILD: ${{ github.run_number }}
          HONEYDEW_FFMPEG_DIR_aarch64_linux_android: ${{ runner.temp }}/ffmpeg/arm64
          HONEYDEW_FFMPEG_DIR_armv7_linux_androideabi: ${{ runner.temp }}/ffmpeg/armv7
        run: |
          set -o pipefail
          strip() { sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log"; }
          base=
          if [ "${{ inputs.variant }}" != full ]; then base=--base; fi
          if ! tools/android-dist.sh $base > "$RUNNER_TEMP/build.log" 2>&1; then
            # The compiler's errors and their locations, and the log's tail, as annotations (ANSI-stripped),
            # so they read without downloading the full log. A step shows at most 10 annotations: each holds up
            # to 40 lines (newlines encoded as %0A).
            { strip | grep -E '^error|^ *-->' | head -360 || true
              strip | tail -n 25; } \
              | awk '{ gsub(/%/, "%25"); buf = (n ? buf "%0A" : "") $0; n++ }
                     n == 40 { print "::error title=android build::" buf; buf = ""; n = 0 }
                     END { if (n) print "::error title=android build::" buf }'
            exit 1
          fi
          strip | tail -n 30
      - name: Publish the APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-debug-${{ github.run_number }}
          KEEP: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(target/honeydew-android-*-arm*-debug.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo '::error title=publish::no APK was built'; exit 1; fi
          short=$(git rev-parse --short HEAD)
          notes="Debug APK (${{ inputs.variant }}) of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh release create "$TAG" "${apks[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Android debug ${{ inputs.variant }} #${{ github.run_number }} ($GITHUB_REF_NAME @ $short)" \
            --notes "$notes"
          echo "::notice title=APK::${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          # Only the newest $KEEP debug pre-releases stay.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-debug-"))] | sort_by(.createdAt) | reverse | .[] | .tagName' \
            | tail -n +$((KEEP + 1)) \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done
