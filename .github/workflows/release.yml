name: Release

# Manual only: Actions → Release → Run workflow, with the release's tag (e.g. v0.5.6); a new tag builds nothing by itself.
on:
  # Builds an existing tag's source with this workflow and replaces its release's downloads.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      platforms:
        description: What to build (android = the signed Android APKs only)
        required: false
        default: all
        type: choice
        options: [all, android]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  TRUNK_VERSION: v0.21.14
  # Where the sound library comes from when the repository tracks no sounds/ parts (tools/fetch-sounds.sh).
  # The library is tracked in sounds/ (from 9ji7/honeydew, as upstream daijro/honeydew is gone); this is only the
  # fallback for a checkout without it: this repository's own v0.0.0 release.
  SOUNDS_REPO: jikk12kk-bot-bot/honeydew
  SOUNDS_TAG: v0.0.0
  BINARYEN_VERSION: version_133
  # The Alpine builds' image, pinned by its multi-arch digest.
  ALPINE_IMAGE: alpine:3.22.7@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f

jobs:
  desktop:
    if: inputs.platforms != 'android'
    strategy:
      fail-fast: false
      matrix:
        # Each x86-64 Linux and Windows download comes twice: the plain one runs on any x86-64 CPU, the -avx2 one is
        # built for x86-64-v3 (AVX2: Intel since 2013, AMD since 2015). Arm builds use the default aarch64 target. Linux
        # builds on the oldest runners, so its downloads run on glibc 2.35 or newer (Ubuntu 22.04, Debian 12). macOS is
        # Apple Silicon only. GitHub has no FreeBSD runners: that build is cross-built (tools/freebsd-cross.sh).
        # `ffmpeg` is the tools/build-ffmpeg.sh target of the build's FFmpeg (video playback and MP4 render).
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, ffmpeg: host }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64-avx2, rustflags: -Ctarget-cpu=x86-64-v3, ffmpeg: host }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64, ffmpeg: host }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ffmpeg: windows-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64-avx2, rustflags: -Ctarget-cpu=x86-64-v3, ffmpeg: windows-x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64, ffmpeg: windows-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, ffmpeg: host }
          - { os: ubuntu-24.04, target: x86_64-unknown-freebsd, name: freebsd-x86_64, ffmpeg: freebsd }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # signalsmith-stretch (Lemon Sampler's time stretching) compiles C++ and runs bindgen, which loads libclang.
      # macOS has it in Xcode; Windows images ship LLVM (the Arm one too), installed here if missing.
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: FreeBSD sysroot
        if: matrix.target == 'x86_64-unknown-freebsd'
        run: sudo apt-get install -y clang lld llvm && sh tools/freebsd-cross.sh "$RUNNER_TEMP"
      - name: libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      # The static FFmpeg (with x264) of the Displayer's video and the MP4 render (the `video` feature), built by
      # tools/build-ffmpeg.sh and cached until that changes. Windows builds it with MSVC in an MSYS2 shell.
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ matrix.os }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: MSYS2
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make diffutils pkgconf tar
      - name: Visual Studio environment
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.ffmpeg == 'windows-arm64' && 'arm64' || 'amd64' }}
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/ci-ffmpeg.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg/out" ${{ matrix.ffmpeg }}
      - name: FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: bash
        run: tools/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg/out" ${{ matrix.ffmpeg }}
      # Saved at once, so that a later failure of the app's build does not build FFmpeg again.
      - name: FFmpeg cache save
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ matrix.os }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bins --features video
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          HONEYDEW_FFMPEG_DIR: ${{ runner.temp }}/ffmpeg/out
      # Each build twice: the full download, and the app alone (`-no-sounds`), which uses the sound library installed
      # in the app data folder (the release's own `honeydew-<tag>-sounds.zip`, uploaded by the `sounds` job).
      - name: Package
        shell: bash
        run: bash tools/package-desktop.sh "honeydew-${TAG}-${{ matrix.name }}" target/${{ matrix.target }}/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: honeydew-${{ env.TAG }}-*.*z*
          fail_on_unmatched_files: true
      # After the archive's upload, so a failure here can't cost it.
      - name: AppImage
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          dir=honeydew-${TAG}-${{ matrix.name }}
          arch=$(uname -m)
          # The AppDir layout: AppRun, the desktop file and its icon at the root, the rest under usr/. The app finds
          # its sounds at <exe dir>/../share/honeydew/content.
          share=AppDir/usr/share
          mkdir -p AppDir/usr/bin "$share/applications" "$share/honeydew" "$share/doc/honeydew"
          cp "$dir/honeydew-native" "$dir/honeydew-import" AppDir/usr/bin/
          ln -s usr/bin/honeydew-native AppDir/AppRun
          mv "$dir/content" "$share/honeydew/"
          cp "$dir/README.md" "$dir/LICENSE" "$share/doc/honeydew/"
          cp -R "$dir/linux/icons" "$share/"
          cp "$dir/linux/honeydew.desktop" AppDir/
          cp "$dir/linux/honeydew.desktop" "$share/applications/"
          cp "$dir/linux/icons/hicolor/256x256/apps/honeydew.png" AppDir/honeydew.png
          cp AppDir/honeydew.png AppDir/.DirIcon
          # Nothing to bundle: every library honeydew-native links is one AppImages leave to the system (glibc,
          # libstdc++, libgcc_s, ALSA's libasound). The graphics stack, X11 and Wayland are loaded at run time.
          if ldd AppDir/usr/bin/honeydew-native | awk '{print $1}' |
            grep -vxE 'linux-vdso\.so\.1|/lib(64)?/ld-linux-(x86-64|aarch64)\.so\.[0-9]+|lib(c|m|dl|pthread|rt|gcc_s|stdc\+\+|asound)\.so\.[0-9]+'; then
            echo 'honeydew-native links a library above that the AppImage would have to bundle' >&2
            exit 1
          fi
          # appimagetool and the AppImage runtime, the runner's arch's own, pinned by version and SHA-256.
          if [ "$arch" = aarch64 ]; then
            tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
          else
            tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          fi
          curl --retry 3 -sSfLo "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          curl --retry 3 -sSfLo "$RUNNER_TEMP/runtime" "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch"
          printf '%s  %s\n' "$tool_sha" "$RUNNER_TEMP/appimagetool" "$runtime_sha" "$RUNNER_TEMP/runtime" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          # VERSION becomes the desktop file's X-AppImage-Version. Extract-and-run needs no FUSE on the runner.
          ARCH=$arch VERSION="${TAG#v}" "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            --runtime-file "$RUNNER_TEMP/runtime" AppDir "$dir.AppImage"
      - uses: softprops/action-gh-release@v2
        if: contains(matrix.target, 'linux')
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: honeydew-${{ env.TAG }}-*.AppImage
          fail_on_unmatched_files: true

  # Alpine and other musl Linux: built in the pinned Alpine image (tools/alpine-build.sh), packaged as the glibc Linux
  # tarballs are, without an AppImage.
  alpine:
    if: inputs.platforms != 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64-musl }
          - { os: ubuntu-24.04-arm, name: linux-aarch64-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      # FFmpeg for the video (built in the container by tools/alpine-build.sh when the cache has none).
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-musl-${{ matrix.os }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/ffmpeg:/ffmpeg" -e HONEYDEW_FFMPEG_DIR=/ffmpeg/out -w /src \
            "$ALPINE_IMAGE" sh tools/alpine-build.sh
      - name: FFmpeg cache save
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-musl-${{ matrix.os }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Package
        run: bash tools/package-desktop.sh "honeydew-${TAG}-${{ matrix.name }}" target/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: honeydew-${{ env.TAG }}-*.*z*
          fail_on_unmatched_files: true

  # The sound library on its own, once per release: the parts joined, `content/` at its top, without the web's
  # gzipped copies (`*.gz`). A job of its own, so no build's failure can cost it, nor its upload a build's downloads.
  sounds:
    if: inputs.platforms != 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      - run: |
          cat sounds/honeydew-sounds.zip.[0-9][0-9][0-9] > "honeydew-${TAG}-sounds.zip"
          command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
          # Exit 12 is zip's "nothing to do": a library without the web's .gz copies (tools/fetch-sounds.sh).
          zip -dq "honeydew-${TAG}-sounds.zip" '*.gz' || [ $? -eq 12 ]
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: honeydew-${{ env.TAG }}-sounds.zip
          fail_on_unmatched_files: true
      # The sound library's own release, `sounds-<version>` (sounds/release.txt), made once per library version: its
      # index (the manifest: every part's name, size and SHA-256), its credits, and each part as a download of its own,
      # flat (`p/<hash>.tar` is `<hash>.tar`). The apps download from it only the parts they lack (src/update.rs), so
      # an app release that leaves the sounds as they were costs no one a download. A prerelease, so never the latest
      # release the apps' update check reads. Only what is missing is uploaded before it is published: a run cut short
      # is finished by the next.
      # Made from a downloaded library too: upstream's releases, where the apps got it before, are gone.
      - name: Sound library release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rel=sounds-$(tr -d '[:space:]' < sounds/release.txt)
          unzip -q "honeydew-${TAG}-sounds.zip" content/index.json content/CREDITS.txt 'content/p/*.tar' -d library
          if ! gh release view "$rel" >/dev/null 2>&1; then
            gh release create "$rel" --draft --prerelease --target "$(git rev-parse HEAD)" --title "Sound library ${rel#sounds-}" \
              --notes "The sound library the apps download, only the parts they lack. Not an app release: get Honeydew from the latest release."
          fi
          have=$(gh release view "$rel" --json assets --jq '.assets[].name')
          # A library version is never published twice with other sounds.
          if printf '%s\n' "$have" | grep -qxF index.json; then
            gh release download "$rel" --pattern index.json --output published-index.json
            cmp -s published-index.json library/content/index.json ||
              { echo "::error::$rel has another index.json: give the new sound library a new version"; exit 1; }
          fi
          for file in library/content/p/*.tar library/content/CREDITS.txt library/content/index.json; do
            printf '%s\n' "$have" | grep -qxF "$(basename "$file")" || gh release upload "$rel" "$file"
          done
          gh release edit "$rel" --draft=false

  web:
    if: inputs.platforms != 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Trunk and wasm-opt
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" >> "$GITHUB_ENV"
      - run: tools/web-dist.sh --zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: target/honeydew-web-*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name repository secret; see README Android release signing."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/honeydew-release.jks"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      # The static FFmpeg (with x264) of the Displayer's video and the MP4 render, per ABI; cached until the script
      # changes (the same cache as android-apk.yml's).
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: |
          for abi in arm64 armv7; do
            tools/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg/$abi" android-$abi
          done
      - name: FFmpeg cache save
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg.sh') }}
      # Twice: with the sounds (-arm.apk), and without them (-arm-base.apk), which downloads them from the sound
      # library's release and is what the in-app updater installs.
      - name: Build signed APKs with and without sounds
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/honeydew-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # With both, tools/android-dist.sh builds with the `video` feature.
          HONEYDEW_FFMPEG_DIR_aarch64_linux_android: ${{ runner.temp }}/ffmpeg/arm64
          HONEYDEW_FFMPEG_DIR_armv7_linux_androideabi: ${{ runner.temp }}/ffmpeg/armv7
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          # An ANDROID_KEY_ALIAS that names no key in a keystore holding just one: that key (the alias is no secret).
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            aliases=$(keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^\([^,]*\), .*PrivateKeyEntry.*/\1/p')
            if [ "$(printf '%s\n' "$aliases" | grep -c .)" = 1 ]; then
              echo "::warning::ANDROID_KEY_ALIAS names no key in the keystore; signing with its only key, '$aliases'. Set the secret to it."
              export ANDROID_KEY_ALIAS="$aliases"
            fi
          fi
          tools/android-dist.sh --release
          tools/android-dist.sh --release --base
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/honeydew-release.jks"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            target/honeydew-android-*-arm.apk
            target/honeydew-android-*-arm-base.apk
          fail_on_unmatched_files: true

  # iOS (experimental): two unsigned IPAs, with and without the sounds (tools/ios-dist.sh), which AltStore, SideStore and
  # Sideloadly sign with the user's own Apple ID.
  ios:
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sound library
        shell: bash
        run: bash tools/fetch-sounds.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-ios-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg/out" ios
      - name: FFmpeg cache save
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-ios-${{ hashFiles('tools/build-ffmpeg.sh') }}
      # With it, tools/ios-dist.sh builds with the `video` feature.
      - run: tools/ios-dist.sh
        env:
          HONEYDEW_FFMPEG_DIR_aarch64_apple_ios: ${{ runner.temp }}/ffmpeg/out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # A tag with a suffix (v0.5.5-pre.1) is a pre-release: never the latest release the apps update from.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: target/honeydew-ios-*.ipa
          fail_on_unmatched_files: true
