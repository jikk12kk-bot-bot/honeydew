name: Diagnose (temporary)

# Temporary: runs CI's test steps and the release's Android signing on this branch and posts the results as commit
# comments (the Actions logs can't be read from where the fix is made). Deleted once fixed.
on:
  push:
    branches: [arena/d303fce9-honeydew]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  GH_TOKEN: ${{ github.token }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/content-build
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: Tests
        run: |
          set +e
          cargo test --workspace --no-fail-fast > test.txt 2>&1; t=$?
          cargo check --workspace --target wasm32-unknown-unknown > wasm.txt 2>&1; w=$?
          cargo test --manifest-path tools/content-build/Cargo.toml --no-fail-fast > content.txt 2>&1; c=$?
          {
            echo "### test exit $t, wasm exit $w, content exit $c"
            echo '```'
            echo "--- failing tests:"; grep -E '^test .* FAILED$|^    [a-z_:0-9]+$' test.txt | sort -u
            echo "--- results:"; grep -E '^test result:|Running |error(\[|:)' test.txt | grep -B1 -E 'FAILED|error' | head -60
            echo "--- panics:"; grep -E "panicked at|^thread '" test.txt | head -80
            [ $w -ne 0 ] && { echo "--- wasm:"; grep -E -A6 '^error' wasm.txt | head -60; }
            [ $c -ne 0 ] && { echo "--- content:"; grep -E 'FAILED|panicked|^error' content.txt | head -40; }
            echo '```'
          } > body.md
          head -c 64000 body.md > b.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@b.md > /dev/null

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Signing check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          ks="$RUNNER_TEMP/release.jks"; umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          {
            echo "### android signing check"
            echo '```'
            echo "keystore bytes: $(wc -c < "$ks")"
            echo "lengths: store_pw=${#ANDROID_KEYSTORE_PASSWORD} alias=${#ANDROID_KEY_ALIAS} key_pw=${#ANDROID_KEY_PASSWORD}"
            echo "alias secret: '$ANDROID_KEY_ALIAS'"
            echo "store pw == key pw: $([ "$ANDROID_KEYSTORE_PASSWORD" = "$ANDROID_KEY_PASSWORD" ] && echo yes || echo no)"
            echo "--- aliases in the keystore:"
            keytool -list -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | grep -E 'PrivateKeyEntry|error|password|Keystore type'
            echo "--- alias found: $(keytool -list -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 && echo yes || echo no)"
            echo "--- key password: $(keytool -certreq -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>"$RUNNER_TEMP/kp.txt" && echo ok || { echo FAILED; cat "$RUNNER_TEMP/kp.txt"; })"
            echo '```'
          } > raw.md
          rm -f "$ks"
          python3 - <<'PY'
          import os
          s = open('raw.md').read()
          for k in ('ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD'):
              v = os.environ.get(k, '')
              if len(v) >= 3:
                  s = s.replace(v, '***')
          open('body.md', 'w').write(s)
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@body.md > /dev/null
