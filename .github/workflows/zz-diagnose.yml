name: zz-diagnose

on:
  push:
    branches: [arena/5d4fd720-honeydew]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: fmt
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "cargo fmt"
            git push
          fi
      - name: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy.txt 2>&1
          echo "CLIPPY=$?" >> $GITHUB_ENV
      - name: test
        run: |
          set +e
          cargo test --workspace --no-fail-fast > test.txt 2>&1
          echo "TEST=$?" >> $GITHUB_ENV
      - name: wasm
        run: |
          set +e
          cargo check --workspace --target wasm32-unknown-unknown > wasm.txt 2>&1
          echo "WASM=$?" >> $GITHUB_ENV
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "clippy=$CLIPPY test=$TEST wasm=$WASM"
            echo
            echo '### clippy'
            echo '```'
            grep -E -A12 '^(error|warning)' clippy.txt | head -c 20000
            echo '```'
            echo '### test failures'
            echo '```'
            grep -E 'FAILED|failed|panicked|^test .* \.\.\. FAILED|error(\[|:)' test.txt | head -c 8000
            echo
            awk '/^failures:$/{f=1} f' test.txt | head -c 30000
            echo '```'
            echo '### wasm'
            echo '```'
            grep -E -A8 '^error' wasm.txt | head -c 8000
            echo '```'
          } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md
