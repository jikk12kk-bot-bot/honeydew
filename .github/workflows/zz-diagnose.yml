name: zz-diagnose
on:
  push:
    branches: [arena/cc109476-honeydew]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: never
jobs:
  video:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: diagnose-video
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-host-ubuntu-22.04-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg/out" host
      - name: Clippy and tests with video
        env:
          HONEYDEW_FFMPEG_DIR: ${{ runner.temp }}/ffmpeg/out
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cargo clippy --locked --all-targets --features video -- -D warnings > clippy.log 2>&1; c=$?
          cargo test --locked --features video --lib -- displayer video > test.log 2>&1; t=$?
          { echo "clippy=$c test=$t"; echo '```'; grep -E '^(error|warning)' -A8 clippy.log | head -80; tail -n 25 test.log; echo '```'; } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md >/dev/null
          [ $c -eq 0 ] && [ $t -eq 0 ]
