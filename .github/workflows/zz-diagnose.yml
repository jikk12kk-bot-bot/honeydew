name: zz-diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: Checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cargo fmt
          { echo "## lint ${GITHUB_SHA}"; echo '```'; } > report.md
          git diff --stat >> report.md
          cargo clippy --workspace --all-targets -- -D warnings > clippy.txt 2>&1
          echo "clippy exit $?" >> report.md
          grep -E "^(error|warning)" -A12 clippy.txt | head -150 >> report.md
          cargo check --workspace --target wasm32-unknown-unknown > wasm.txt 2>&1
          echo "wasm exit $?" >> report.md
          grep -E "^error" -A12 wasm.txt | head -60 >> report.md
          echo '```' >> report.md
          gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments -F body=@report.md
          if ! git diff --quiet; then
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -am "cargo fmt"
            git push
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libclang-dev
      - name: Tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cargo test --workspace > test.txt 2>&1
          code=$?
          { echo "## test ${GITHUB_SHA} exit $code"; echo '```'; } > report.md
          grep -E "^error|panicked|^test .* FAILED|^failures:|test result" -A8 test.txt | head -250 >> report.md
          echo '```' >> report.md
          gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments -F body=@report.md
          exit $code
