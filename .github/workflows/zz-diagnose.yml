name: zz-diagnose
on:
  push:
    branches: [arena/c6b9f5a6-honeydew]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: |
          cargo fmt
          git diff --stat
          if ! git diff --quiet; then
            git -c user.name=jikk12kk-bot-bot -c user.email=259327750+jikk12kk-bot-bot@users.noreply.github.com commit -am "cargo fmt"
            git push
          fi
